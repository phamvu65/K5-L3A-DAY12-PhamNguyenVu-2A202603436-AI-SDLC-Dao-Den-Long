name: Verify Contract & Determinism

on:
  push:
    branches: [ main ]
    tags: [ 'phase-*', 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Unit, Scenario & Determinism Tests
        run: node tests/run_tests.js
